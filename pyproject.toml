[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "article-agent"
version = "0.1.0"
description = "Evidence-first article extraction Agent MVP"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.0",
  "pydantic>=2.0",
  "openpyxl>=3.1",
  "pdfplumber>=0.10",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0",
  "rank-bm25>=0.2.2",
  "pytest>=8.0",
]

[project.scripts]
article-agent = "article_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["article_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
